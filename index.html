<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyrbylent | Bio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d11;
      color: #fff;
    }

    /* Фоновое фото framee.png */
    .bg-img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.4) contrast(1.1);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
      z-index: -1;
    }

    /* Единый контейнер по центру */
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    /* 1. Аватарка вверху */
    .top-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
      margin-bottom: 12px;
      background-color: #1a1a1f;
    }

    /* 2. Плеер (ширина 340px) */
    .player-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 340px;
      margin-bottom: 20px;
    }

    /* Обложка увеличена на 25% (110px) и опущена впритык */
    .cover-wrapper {
      width: 110px;
      height: 110px;
      margin-bottom: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .track-cover {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 4px 18px rgba(0,0,0,0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: #1a1a1f;
    }

    /* Визуализатор во всю ширину (340px) */
    .visualizer-box {
      width: 340px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 2px;
    }

    #visualizer {
      width: 340px;
      height: 40px;
    }

    /* Ползунок прокрутки */
    .progress-wrap {
      width: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
      cursor: pointer;
    }

    /* Кнопки управления (строго по центру ползунка) */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      width: 340px;
      text-align: center;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.85;
      transition: transform 0.15s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    .play-pause-btn {
      font-size: 20px;
    }

    /* 3. Панели ссылок (ширина 340px) */
    .links-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 340px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Гарантированный фон framee.png -->
  <img class="bg-img" src="framee.png" alt="Background">
  <div class="overlay"></div>

  <div class="wrapper">
    <img class="top-avatar" src="avatar.png" alt="Avatar">
    
    <div class="player-hud" id="player-container"></div>
    <div class="links-box" id="links-container"></div>
  </div>

  <audio id="audio-player" loop autoplay crossorigin="anonymous">
    <source src="Music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const links = [
      { title: "ссылка на тик ток", url: "https://tiktok.com" },
      { title: "ссылка на дискорд", url: "https://discord.gg" },
      { title: "ссылка на стим", url: "https://steamcommunity.com" }
    ];

    // Отрисовка плеера
    const playerContainer = document.getElementById('player-container');
    playerContainer.innerHTML = `
      <div class="cover-wrapper">
        <img class="track-cover" src="oblozka.jpg" alt="Cover">
      </div>
      <div class="visualizer-box">
        <canvas id="visualizer" width="340" height="40"></canvas>
      </div>
      <div class="progress-wrap">
        <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" max="100">
      </div>
      <div class="controls">
        <button class="ctrl-btn">♥</button>
        <button class="ctrl-btn" id="prev-btn">◄◄</button>
        <button class="ctrl-btn play-pause-btn" id="play-btn">❚❚</button>
        <button class="ctrl-btn" id="next-btn">►►</button>
      </div>
    `;

    const linksContainer = document.getElementById('links-container');
    links.forEach(item => {
      const a = document.createElement('a');
      a.className = 'link-card';
      a.href = item.url;
      a.target = '_blank';
      a.innerText = item.title;
      linksContainer.appendChild(a);
    });

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    // Громкость 50% и постоянный повтор
    audio.volume = 0.5;
    audio.loop = true;

    let audioCtx, analyser, source, dataArray;
    let isAudioSetup = false;

    function initAudioContext() {
      if (isAudioSetup) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.75;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        isAudioSetup = true;
        drawVisualizer();
      } catch (e) {
        console.log("Audio API Error:", e);
      }
    }

    // Визуализатор на всю ширину 340px
    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;

      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const totalBars = 38;
      const barWidth = 4;
      const gap = 5;
      const startX = (canvas.width - (totalBars * (barWidth + gap))) / 2;

      for (let i = 0; i < totalBars; i++) {
        const value = dataArray[i + 2] || dataArray[i] || 0;
        const barHeight = (value / 255) * canvas.height;
        const x = startX + i * (barWidth + gap);
        const y = canvas.height - barHeight;

        ctx.fillStyle = `rgba(255, 255, 255, ${0.45 + (value / 255) * 0.55})`;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, Math.max(barHeight, 2), 2);
        ctx.fill();
      }
    }

    // Старт музыки
    window.addEventListener('load', () => {
      audio.play().then(() => {
        initAudioContext();
        playBtn.innerText = '❚❚';
      }).catch(() => {
        playBtn.innerText = '▶';
      });
    });

    playBtn.addEventListener('click', () => {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      if (audio.paused) {
        audio.play();
        playBtn.innerText = '❚❚';
      } else {
        audio.pause();
        playBtn.innerText = '▶';
      }
    });

    document.body.addEventListener('click', () => {
      if (audio.paused) {
        initAudioContext();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        audio.play().then(() => playBtn.innerText = '❚❚').catch(() => {});
      }
    }, { once: true });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    progressBar.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });
  </script>

</body>
</html>
