<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyrbylent | Official Bio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      color: #fff;
    }

    /* Фоновое фото с пульсацией под басы */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('framee.png') no-repeat center center;
      background-size: cover;
      z-index: 0;
      will-change: transform, filter;
      transition: transform 0.05s ease-out, filter 0.05s ease-out;
      filter: brightness(0.65) contrast(1.1);
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(15, 15, 25, 0.2) 0%, rgba(5, 5, 8, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Холст для снега и следа мыши */
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      padding: 20px;
      position: relative;
      z-index: 3;
      perspective: 1200px;
    }

    /* Основной премиум-контейнер */
    .main-card {
      width: 360px;
      background: rgba(18, 20, 29, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.15s ease-out, box-shadow 0.2s ease;
    }

    .main-card:hover {
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.7),
                  0 0 40px rgba(255, 255, 255, 0.08),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    /* Аватар */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 14px;
    }

    .top-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      display: block;
      transition: border-color 0.3s, transform 0.3s;
    }

    .status-badge {
      position: absolute;
      bottom: 2px;
      right: 4px;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #00ffaa;
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(8px);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #00ffaa;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ffaa;
    }

    /* Информация профиля */
    .profile-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 2px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .profile-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* Музыкальный Плеер */
    .player-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .cover-wrapper {
      width: 90px;
      height: 90px;
      margin-bottom: 12px;
      perspective: 800px;
    }

    .track-cover {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
      will-change: transform, box-shadow;
      transition: transform 0.1s ease-out;
    }

    .visualizer-box {
      width: 100%;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 8px;
    }

    #visualizer {
      width: 100%;
      height: 32px;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .progress-bar::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .controls {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .play-pause-btn {
      width: 40px;
      height: 40px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Плашки ссылок */
    .links-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.25s ease;
      overflow: hidden;
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .link-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
    }

    .link-arrow {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      transition: transform 0.2s ease, color 0.2s ease;
      z-index: 2;
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

      background: rgba(255, 255,
