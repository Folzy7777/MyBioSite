<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyrbylent | Official Bio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      cursor: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      color: #fff;
    }

    /* Курсор */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9),
                  0 0 25px rgba(255, 255, 255, 0.4);
      transition: width 0.2s, height 0.2s, background-color 0.2s, box-shadow 0.2s;
      will-change: transform;
    }

    #custom-cursor.hovered {
      width: 28px;
      height: 28px;
      background: rgba(255, 0, 60, 0.85);
      box-shadow: 0 0 20px rgba(255, 0, 60, 0.9),
                  0 0 40px rgba(255, 0, 60, 0.5);
    }

    /* Интро */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #030305;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.5s ease;
    }

    .intro-content {
      text-align: center;
      animation: pulseIntro 2s infinite ease-in-out;
    }

    .intro-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }

    .intro-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @keyframes pulseIntro {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.03); opacity: 1; }
    }

    #intro-screen.hide {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    /* Фон с параллаксом */
    .bg-image {
      position: fixed;
      top: -30px;
      left: -30px;
      width: calc(100vw + 60px);
      height: calc(100vh + 60px);
      background: url('framee.png') no-repeat center center;
      background-size: cover;
      z-index: 0;
      will-change: transform, filter;
      transition: filter 0.05s ease-out;
      filter: brightness(0.65) contrast(1.1);
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(15, 15, 25, 0.15) 0%, rgba(3, 3, 5, 0.88) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .side-glow-left, .side-glow-right {
      position: fixed;
      top: 0;
      width: 25vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.35;
      transition: opacity 0.5s ease;
    }

    .side-glow-left {
      left: 0;
      background: linear-gradient(90deg, rgba(120, 50, 255, 0.25), transparent);
    }

    .side-glow-right {
      right: 0;
      background: linear-gradient(270deg, rgba(0, 255, 170, 0.2), transparent);
    }

    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 3;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      padding: 20px;
      position: relative;
      z-index: 4;
    }

    /* Основная карточка */
    .main-card {
      width: 360px;
      background: rgba(18, 20, 29, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ДИСКОРД ПЛАШКА ВМЕСТО ПРОСТОЙ АВАТАРКИ */
    .discord-badge {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
      backdrop-filter: blur(10px);
    }

    .discord-avatar-wrap {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .discord-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Индикатор статуса */
    .discord-status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid #12141d;
      background: #747f8d; /* Оффлайн по умолчанию */
      transition: background 0.3s ease;
    }

    .discord-status-dot.online { background: #23a55a; box-shadow: 0 0 10px #23a55a; }
    .discord-status-dot.idle { background: #f0b232; box-shadow: 0 0 10px #f0b232; }
    .discord-status-dot.dnd { background: #f23f43; box-shadow: 0 0 10px #f23f43; }
    .discord-status-dot.offline { background: #80848e; }

    .discord-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      text-align: left;
    }

    .discord-username {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .discord-activity {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .discord-activity span {
      color: #fff;
      font-weight: 700;
    }

    /* Сохраняем надпись Digital Creator */
    .profile-subtitle {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* Музыкальный Плеер */
    .player-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .cover-wrapper {
      width: 90px;
      height: 90px;
      margin-bottom: 12px;
    }

    .track-cover {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
      will-change: transform, box-shadow;
      transition: transform 0.1s ease-out;
    }

    .visualizer-box {
      width: 100%;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 8px;
    }

    #visualizer {
      width: 100%;
      height: 32px;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transition: transform 0.15s;
    }

    .progress-bar::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .controls {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .play-pause-btn {
      width: 40px;
      height: 40px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Плашки ссылок */
    .links-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(18, 20, 29, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .link-card:hover {
      background: rgba(255, 0, 60, 0.12);
      border-color: rgba(255, 0, 60, 0.8);
      box-shadow: 0 8px 30px rgba(255, 0, 60, 0.35), 0 4px 15px rgba(0,0,0,0.4);
      transform: translateY(-2px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .link-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      transition: color 0.3s ease;
    }

    .link-card:hover .link-icon {
      color: #ff003c;
      text-shadow: 0 0 10px rgba(255, 0, 60, 0.8);
    }

    .link-arrow {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      transition: transform 0.2s ease, color 0.2s ease;
      z-index: 2;
    }

    .link-card:hover .link-arrow {
      transform: translateX(3px);
      color: #ff003c;
    }
  </style>
</head>
<body>

  <!-- Кастомный курсор -->
  <div id="custom-cursor"></div>

  <!-- Экран входа -->
  <div id="intro-screen">
    <div class="intro-content">
      <div class="intro-title">TYRBYLENT</div>
      <div class="intro-subtitle">Click anywhere to enter</div>
    </div>
  </div>

  <div class="bg-image" id="bg-img"></div>
  <div class="bg-overlay"></div>
  
  <div class="side-glow-left" id="glow-left"></div>
  <div class="side-glow-right" id="glow-right"></div>

  <canvas id="snow-canvas"></canvas>

  <div class="wrapper">
    <div class="main-card">
      
      <!-- Интегрированная Discord плашка -->
      <div class="discord-badge">
        <div class="discord-avatar-wrap">
          <img class="discord-avatar" id="discord-avatar" src="avatar.png" alt="Discord Avatar">
          <div class="discord-status-dot" id="discord-status"></div>
        </div>
        <div class="discord-info">
          <div class="discord-username" id="discord-username">Tyrbylent</div>
          <div class="discord-activity" id="discord-activity">Offline</div>
        </div>
      </div>

      <div class="profile-subtitle">Digital Creator</div>
      
      <div class="player-hud" id="player-container"></div>
      
      <div class="links-box" id="links-container"></div>

    </div>
  </div>

  <audio id="audio-player" loop crossorigin="anonymous">
    <source src="Music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const DISCORD_ID = "978644075433570415";

    const links = [
      { title: "TikTok", label: "@tyrbylent1", icon: "fa-brands fa-tiktok", url: "https://www.tiktok.com/@tyrbylent1?_r=1&_t=ZS-9B0EDvCNmD7" },
      { title: "Discord", label: "folzygame", icon: "fa-brands fa-discord", url: "https://discord.com/users/978644075433570415" },
      { title: "Steam", label: "tyrbylentnost", icon: "fa-brands fa-steam", url: "https://steamcommunity.com/profiles/76561198884991493/" }
    ];

    const playerContainer = document.getElementById('player-container');
    playerContainer.innerHTML = `
      <div class="cover-wrapper">
        <img class="track-cover" id="track-cover" src="oblozka.jpg" alt="Cover">
      </div>
      <div class="visualizer-box">
        <canvas id="visualizer" width="300" height="32"></canvas>
      </div>
      <div class="progress-wrap">
        <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" max="100">
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="ctrl-btn play-pause-btn" id="play-btn"><i class="fa-solid fa-play"></i></button>
        <button class="ctrl-btn" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    `;

    const linksContainer = document.getElementById('links-container');
    links.forEach(item => {
      const a = document.createElement('a');
      a.className = 'link-card';
      a.href = item.url;
      a.target = '_blank';
      a.innerHTML = `
        <div class="link-left">
          <i class="${item.icon} link-icon"></i>
          <span>${item.title}</span>
        </div>
        <i class="fa-solid fa-chevron-right link-arrow"></i>
      `;
      linksContainer.appendChild(a);
    });

    /* --- ЛОГИКА LANYARD API (DISCORD REALTIME STATUS) --- */
    async function fetchDiscordStatus() {
      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const json = await response.json();
        
        if (!json.success || !json.data) return;
        const data = json.data;

        // Обновляем аватарку
        const avatarImg = document.getElementById('discord-avatar');
        if (data.discord_user.avatar) {
          avatarImg.src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${data.discord_user.avatar}.png?size=128`;
        }

        // Обновляем имя
        const usernameEl = document.getElementById('discord-username');
        usernameEl.innerText = data.discord_user.global_name || data.discord_user.username;

        // Обновляем статус (online, idle, dnd, offline)
        const statusDot = document.getElementById('discord-status');
        statusDot.className = `discord-status-dot ${data.discord_status}`;

        // Обновляем активность
        const activityEl = document.getElementById('discord-activity');
        const game = data.activities.find(act => act.type === 0); // Type 0 = Playing

        if (game) {
          activityEl.innerHTML = `Playing <span>${game.name}</span>`;
        } else if (data.activities.length > 0 && data.activities[0].state) {
          activityEl.innerText = data.activities[0].state;
        } else {
          activityEl.innerText = data.discord_status === 'offline' ? 'Offline' : 'Online';
        }
      } catch (e) {
        console.log("Discord Lanyard Error:", e);
      }
    }

    fetchDiscordStatus();
    setInterval(fetchDiscordStatus, 10000); // автообновление каждые 10 сек
    /* ---------------------------------------------------- */

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const trackCover = document.getElementById('track-cover');
    const bgImg = document.getElementById('bg-img');
    const introScreen = document.getElementById('intro-screen');
    const glowLeft = document.getElementById('glow-left');
    const glowRight = document.getElementById('glow-right');
    const cursor = document.getElementById('custom-cursor');

    audio.volume = 0.5;
    audio.currentTime = 12;

    let audioCtx, analyser, source, dataArray;
    let isAudioSetup = false;

    /* --- WEB AUDIO SOUND EFFECTS --- */
    let soundCtx = null;

    function getSoundContext() {
      if (!soundCtx) soundCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (soundCtx.state === 'suspended') soundCtx.resume();
      return soundCtx;
    }

    function playUiClickSound() {
      try {
        const c = getSoundContext();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, c.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.04);
      } catch (e) {}
    }

    let lastVibrateTime = 0;
    function playVibrateSound() {
      try {
        const now = Date.now();
        if (now - lastVibrateTime < 45) return;
        lastVibrateTime = now;

        const c = getSoundContext();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(90, c.currentTime);
        osc.frequency.linearRampToValueAtTime(60, c.currentTime + 0.03);
        gain.gain.setValueAtTime(0.05, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.03);
      } catch (e) {}
    }

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('click', playUiClickSound);
    });

    progressBar.addEventListener('input', () => {
      playVibrateSound();
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    /* --- КУРСОР И ПАРАЛЛАКС --- */
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    let bgX = 0;
    let bgY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function updateCursorAndParallax() {
      cursorX = mouseX;
      cursorY = mouseY;
      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;

      const targetBgX = (mouseX / window.innerWidth - 0.5) * -25;
      const targetBgY = (mouseY / window.innerHeight - 0.5) * -25;
      bgX += (targetBgX - bgX) * 0.1;
      bgY += (targetBgY - bgY) * 0.1;
      bgImg.style.transform = `translate(${bgX}px, ${bgY}px) scale(${window.currentBgScale || 1})`;

      requestAnimationFrame(updateCursorAndParallax);
    }
    updateCursorAndParallax();

    document.querySelectorAll('a, button, input').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
    });

    function initAudioContext() {
      if (isAudioSetup) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.7;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        isAudioSetup = true;
        drawVisualizer();
      } catch (e) {
        console.log("Audio API Error:", e);
      }
    }

    window.currentBgScale = 1;

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;

      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let bassSum = 0;
      for (let i = 0; i < 5; i++) {
        bassSum += dataArray[i];
      }
      const bassAvg = bassSum / 5;
      const bassRatio = bassAvg / 255;

      const scaleCover = 1 + (bassRatio * 0.12); 
      window.currentBgScale = 1 + (bassRatio * 0.035);    
      const glowBlur = 15 + (bassRatio * 35);     

      trackCover.style.transform = `scale(${scaleCover})`;
      trackCover.style.boxShadow = `0 4px ${glowBlur}px rgba(255, 255, 255, ${0.25 + bassRatio * 0.55}), 0 4px 15px rgba(0,0,0,0.8)`;

      glowLeft.style.opacity = 0.2 + (bassRatio * 0.5);
      glowRight.style.opacity = 0.2 + (bassRatio * 0.5);

      const totalBars = 30;
      const barWidth = 4;
      const gap = 4;
      const startX = (canvas.width - (totalBars * (barWidth + gap))) / 2;

      for (let i = 0; i < totalBars; i++) {
        const value = dataArray[i + 2] || 0;
        const barHeight = (value / 255) * canvas.height;
        const x = startX + i * (barWidth + gap);
        const y = canvas.height - barHeight;

        const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0.95)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, Math.max(barHeight, 2), 2);
        ctx.fill();
      }
    }

    function launchSite(e) {
      e.stopPropagation();
      introScreen.classList.add('hide');
      initAudioContext();
      getSoundContext();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      
      audio.play().then(() => {
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      }).catch(err => console.log("Play blocked:", err));
    }

    ['click', 'keydown', 'touchstart'].forEach(evt => {
      introScreen.addEventListener(evt, launchSite, { once: true });
    });

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      } else {
        audio.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration && document.activeElement !== progressBar) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    /* --- СНЕГ И ШЛЕЙФ МЫШИ --- */
    const snowCanvas = document.getElementById('snow-canvas');
    const sCtx = snowCanvas.getContext('2d');

    function resizeSnowCanvas() {
      snowCanvas.width = window.innerWidth;
      snowCanvas.height = window.innerHeight;
    }
    resizeSnowCanvas();
    window.addEventListener('resize', resizeSnowCanvas);

    const snowFlakes = [];
    const maxFlakes = 50;

    for (let i = 0; i < maxFlakes; i++) {
      snowFlakes.push({
        x: Math.random() * snowCanvas.width,
        y: Math.random() * snowCanvas.height,
        r: Math.random() * 2 + 0.8,
        speedY: Math.random() * 0.7 + 0.3,
        speedX: Math.random() * 0.4 - 0.2,
        opacity: Math.random() * 0.5 + 0.2
      });
    }

    const mouseTrail = [];

    window.addEventListener('mousemove', (e) => {
      for (let i = 0; i < 2; i++) {
        mouseTrail.push({
          x: e.clientX,
          y: e.clientY,
          vx: (Math.random() - 0.5) * 1.2,
          vy: Math.random() * 1 + 0.3,
          r: Math.random() * 2 + 1,
          life: 1,
          decay: Math.random() * 0.025 + 0.015
        });
      }
    });

    function animateSnow() {
      requestAnimationFrame(animateSnow);
      sCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);

      snowFlakes.forEach(f => {
        f.y += f.speedY;
        f.x += f.speedX;

        if (f.y > snowCanvas.height) {
          f.y = -10;
          f.x = Math.random() * snowCanvas.width;
        }

        sCtx.fillStyle = `rgba(255, 255, 255, ${f.opacity})`;
        sCtx.beginPath();
        sCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        sCtx.fill();
      });

      for (let i = mouseTrail.length - 1; i >= 0; i--) {
        const p = mouseTrail[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
          mouseTrail.splice(i, 1);
          continue;
        }

        sCtx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.6})`;
        sCtx.beginPath();
        sCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        sCtx.fill();
      }
    }

    animateSnow();
  </script>

</body>
