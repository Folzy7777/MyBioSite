<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyrbylent Bio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0c;
      color: #fff;
    }

    /* Фоновое видео (fon.mp4) */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.4) contrast(1.1);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.75) 100%);
      z-index: -1;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* Аватарка вверху (avatar.png) */
    .top-avatar {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      margin-bottom: 20px;
      background-color: #222;
    }

    /* HUD плеера */
    .player-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      margin-bottom: 22px;
      position: relative;
    }

    .cover-wrapper {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }

    #visualizer {
      position: absolute;
      width: 170px;
      height: 90px;
      z-index: 1;
      pointer-events: none;
    }

    /* Обложка трека (oblozka.jpg) */
    .track-cover {
      width: 62px;
      height: 62px;
      border-radius: 8px;
      object-fit: cover;
      z-index: 2;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: #222;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      margin: 10px 0 12px 0;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
      cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      opacity: 0.85;
      transition: transform 0.1s, opacity 0.2s;
    }

    .ctrl-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .play-pause-btn {
      font-size: 18px;
    }

    .links-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.26);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Фоновое видео (fon.mp4) -->
  <video autoplay loop muted playsinline id="bg-video">
    <source src="fon.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="wrapper">
    <!-- Аватарка вверху (avatar.png) -->
    <img class="top-avatar" src="avatar.png" alt="Avatar">
    
    <div class="player-hud" id="player-container"></div>
    <div class="links-box" id="links-container"></div>
