<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyrbylent | Bio</title>
  <style>
    @import url(\'https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap\');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: \'Inter\', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      scroll-behavior: smooth;
    }

    /* Фоновое изображение */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url(\'framee.png\') no-repeat center center;
      background-size: cover;
      z-index: 0;
    }

    /* Снежный эффект */
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px;
      position: relative;
      z-index: 2;
      perspective: 1000px;
    }

    .content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 340px;
      margin: 0 auto;
      gap: 20px;
    }

    .tilt-card {
      transition: 
        transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
        box-shadow 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
        border-color 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      will-change: transform;
    }

    /* Аватарка */
    .top-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 4px 25px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
      cursor: pointer;
    }

    .top-avatar:hover, .tilt-card:hover {
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 12px 40px rgba(255, 255, 255, 0.25),
        0 0 0 2px rgba(255, 255, 255, 0.15);
      transform: scale(1.03);
    }

    .player-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .cover-wrapper {
      width: 120px;
      height: 120px;
      margin-top: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .track-cover {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 
        0 6px 30px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      will-change: transform, box-shadow;
      cursor: pointer;
    }

    .visualizer-box {
      width: 340px;
      height: 35px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 2px;
      filter: blur(0.5px);
    }

    #visualizer {
      width: 340px;
      height: 35px;
      border-radius: 4px;
    }

    .progress-wrap {
      width: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      transition: background 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 
        0 0 15px rgba(255, 255, 255, 0.8),
        0 0 0 2px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .progress-bar::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 
        0 0 20px rgba(255, 255, 255, 0.9),
        0 0 0 2px rgba(0, 0, 0, 0.4);
    }

    .progress-bar:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .controls {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 340px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      opacity: 0.9;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      transition: 
        transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
        background 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
        box-shadow 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
        border-color 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .ctrl-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 0 20px rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .play-pause-btn {
      font-size: 16px;
      width: 48px;
      height: 48px;
    }

    .links-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 340px;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: #fff;
      text-decoration: none;
      font-family: \'Inter\', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 
        0 8px 25px rgba(0,0,0,0.3),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 12px 35px rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="bg-image" id="bg-img"></div>
  <canvas id="snow-canvas"></canvas>

  <div class="wrapper">
    <div class="content-container">
      <img class="top-avatar tilt-card" src="avatar.png" alt="Avatar" data-tilt>
      
      <div class="player-hud" id="player-container"></div>
      
      <div class="links-box" id="links-container"></div>
    </div>
  </div>

  <audio id="audio-player" loop autoplay crossorigin="anonymous">
    <source src="Music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const links = [
      { title: "tiktok.com/@tyrbylent1", url: "https://www.tiktok.com/@tyrbylent1?_r=1&_t=ZS-9B0EDvCNmD7" },
      { title: "discord/folzygame", url: "https://discord.com/users/978644075433570415" },
      { title: "steam.com/tyrbylentnost", url: "https://steamcommunity.com/profiles/76561198884991493/" }
    ];

    const playerContainer = document.getElementById(\'player-container\');
    playerContainer.innerHTML = `
      <div class="cover-wrapper">
        <img class="track-cover tilt-card" id="track-cover" src="oblozka.jpg" alt="Cover" data-tilt>
      </div>
      <div class="visualizer-box">
        <canvas id="visualizer" width="340" height="35"></canvas>
      </div>
      <div class="progress-wrap">
        <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" max="100">
      </div>
      <div class="controls">
        <button class="ctrl-btn tilt-card" id="prev-btn" data-tilt>◀◀</button>
        <button class="ctrl-btn play-pause-btn tilt-card" id="play-btn" data-tilt>❚❚</button>
        <button class="ctrl-btn tilt-card" id="next-btn" data-tilt>▶▶</button>
      </div>
    `;

    const linksContainer = document.getElementById(\'links-container\');
    links.forEach(item => {
      const a = document.createElement(\'a\');
      a.className = \'link-card tilt-card\';
      a.href = item.url;
      a.target = \'_blank\';
      a.innerText = item.title;
      a.setAttribute(\'data-tilt\', \'\');
      linksContainer.appendChild(a);
    });

    const audio = document.getElementById(\'audio-player\');
    const playBtn = document.getElementById(\'play-btn\');
    const progressBar = document.getElementById(\'progress-bar\');
    const canvas = document.getElementById(\'visualizer\');
    const ctx = canvas.getContext(\'2d\');
    const trackCover = document.getElementById(\'track-cover\');
    const bgImg = document.getElementById(\'bg-img\');

    audio.volume = 0.5;
    audio.loop = true;
    audio.currentTime = 12;

    let audioCtx, analyser, source, dataArray;
    let isAudioSetup = false;

    function initAudioContext() {
      if (isAudioSetup) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.6;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        
        isAudioSetup = true;
        drawVisualizer();
      } catch (e) {
        console.log("Audio API Error:", e);
      }
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyser) return;

      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let bassSum = 0;
      for (let i = 0; i < 5; i++) {
        bassSum += dataArray[i];
      }
      const bassAvg = bassSum / 5;
      const bassRatio = bassAvg / 255;

      const scaleCover = 1 + (bassRatio * 0.15); 
      const scaleBg = 1 + (bassRatio * 0.03);    
      const glowBlur = 15 + (bassRatio * 30);     

      if(!trackCover.classList.contains(\'is-hovered\')) {
        trackCover.style.transform = `scale(${scaleCover})`;
      }
      trackCover.style.boxShadow = `0 6px ${glowBlur}px rgba(255, 255, 255, ${0.3 + bassRatio * 0.5}), 0 0 0 1px rgba(255, 255, 255, 0.1)`;
      bgImg.style.transform = `scale(${scaleBg})`;

      const totalBars = 36;
      const barWidth = 4;
      const gap = 5;
      const startX = (canvas.width - (totalBars * (barWidth + gap))) / 2;

      for (let i = 0; i < totalBars; i++) {
        const value = dataArray[i + 3] || dataArray[i] || 0;
        const barHeight = (value / 255) * canvas.height;
        const x = startX + i * (barWidth + gap);
        const y = canvas.height - barHeight;

        ctx.fillStyle = `rgba(255, 255, 255, ${0.45 + (value / 255) * 0.55})`;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, Math.max(barHeight, 2), 4);
        ctx.fill();
      }
    }

    function startPlayback() {
      initAudioContext();
      if (audioCtx && audioCtx.state === \'suspended\') audioCtx.resume();
      
      audio.play().then(() => {
        playBtn.innerText = \'❚❚\';
      }).catch(() => {
        playBtn.innerText = \'▶\';
      });
    }

    window.addEventListener(\'DOMContentLoaded\', startPlayback);
    window.addEventListener(\'load\', startPlayback);

    [\'click\', \'mousemove\', \'keydown\', \'touchstart\'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (audio.paused) startPlayback();
      }, { once: true });
    });

    playBtn.addEventListener(\'click\', () => {
      initAudioContext();
      if (audioCtx && audioCtx.state === \'suspended\') audioCtx.resume();

      if (audio.paused) {
        audio.play();
        playBtn.innerText = \'❚❚\';
      } else {
        audio.pause();
        playBtn.innerText = \'▶\';
      }
    });

    audio.addEventListener(\'timeupdate\', () => {
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    progressBar.addEventListener(\'input\', () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    /* --- 3D TILT EFFECT --- */
    document.querySelectorAll(\'[data-tilt]\').forEach(card => {
      card.addEventListener(\'mouseenter\', () => card.classList.add(\'is-hovered\'));
      card.addEventListener(\'mousemove\', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px) scale(1.03)`;
      });

      card.addEventListener(\'mouseleave\', () => {
        card.classList.remove(\'is-hovered\');
        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale(1)`;
      });
    });

    /* --- СНЕГ И ШЛЕЙФ --- */
    const snowCanvas = document.getElementById(\'snow-canvas\');
    const sCtx = snowCanvas.getContext(\'2d\');

    function resizeSnowCanvas() {
      snowCanvas.width = window.innerWidth;
      snowCanvas.height = window.innerHeight;
    }
    resizeSnowCanvas();
    window.addEventListener(\'resize\', resizeSnowCanvas);

    const snowFlakes = [];
    const maxFlakes = 60;

    for (let i = 0; i < maxFlakes; i++) {
      snowFlakes.push({
        x: Math.random() * snowCanvas.width,
        y: Math.random() * snowCanvas.height,
        r: Math.random() * 3 + 1.5,
        speedY: Math.random() * 1.2 + 0.5,
        speedX: Math.random() * 0.8 - 0.4,
        opacity: Math.random() * 0.7 + 0.3
      });
    }

    const mouseTail = [];

    window.addEventListener(\'mousemove\', (e) => {
      for (let i = 0; i < 2; i++) {
        mouseTail.push({
          x: e.clientX,
          y: e.clientY,
          vx: (Math.random() - 0.5) * 1.8,
          vy: Math.random() * 1.5 + 0.6,
          r: Math.random() * 2.5 + 1.5,
          life: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    });

    function animateSnow() {
      requestAnimationFrame(animateSnow);
      sCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);

      snowFlakes.forEach(f => {
        f.y += f.speedY;
        f.x += f.speedX;

        if (f.y > snowCanvas.height) {
          f.y = -10;
          f.x = Math.random() * snowCanvas.width;
        }

        sCtx.fillStyle = `rgba(255, 255, 255, ${f.opacity})`;
        sCtx.beginPath();
        sCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        sCtx.fill();
      });

      for (let i = mouseTail.length - 1; i >= 0; i--) {
        const p = mouseTail[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
          mouseTail.splice(i, 1);
          continue;
        }

        sCtx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.7})`;
        sCtx.beginPath();
        sCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        sCtx.fill();
      }
    }

    animateSnow();
  </script>

</body>
</html>
